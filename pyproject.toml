[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citecell"
version = "0.1.0"
description = "CiteCell: traceable multi-document key-value extraction (PDF / Word / Excel)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # openpyxl 解析不可信 xlsx 时的 XML 攻击防护（安装后 openpyxl 自动启用）
    "defusedxml>=0.7",
    # PDF 默认后端（T0 结论见 docs/VERIFICATION_T0.md；默认 pypdfium2）
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
# 备选 PDF 后端 / 交叉校验（MIT）
pdfminer = ["pdfminer.six>=20231228"]
# 合成 PDF 写出（BSD 类，仅测试与数据生成）
synth = ["reportlab>=4.0"]
# 测试
dev = ["pytest>=8.0"]
# 可选：AGPL-3.0，不得进入默认安装与 exe；M1 不实现该后端
pymupdf-agpl = ["PyMuPDF>=1.24"]  # AGPL-3.0 / Artifex 商业双授权

[project.scripts]
citecell = "citecell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 提示词模板是包内数据文件，普通安装（非可编辑）时也必须带上
[tool.setuptools.package-data]
citecell = ["prompting/templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -q"
